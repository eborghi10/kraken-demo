# SPDX-License-Identifier: BSD-3-Clause
#
# Nav2 tuning for the flat headless sim: Smac Hybrid-A* global planner, MPPI
# local controller.
#
# Deliberate omissions:
#   * No map_server and no static layer. Both costmaps are rolling windows, so
#     the world is remembered only as far back as the window reaches.
#
# The obstacle layer reads the O3DE robot's lidar. The headless sim carries no
# ranging sensor, so there the layer simply never receives an observation and
# the costmaps stay empty, as they always were.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: odometry/filtered
    # Jazzy defaults this to false; Kilted flips it. The simulator subscribes to
    # geometry_msgs/Twist, so pin it rather than inherit the distro's opinion.
    enable_stamped_cmd_vel: false
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "headland_goal_checker"]
    controller_plugins: ["FollowPath", "HeadlandPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # The end of a row is a place, not a point. At 0.25 m a 3.1 m machine
      # that cannot stop dead drives past its own goal and then has to come
      # round for it: one run overshot by 4 m and gave up. 0.6 m is inside the
      # width of the aisle it is standing in.
      xy_goal_tolerance: 0.6
      # A steered robot reaches a heading only by driving to it, so holding it
      # to one it was never asked for turns arriving into an endless circuit.
      # The scenarios score the position they reach; when a task genuinely
      # needs a heading it should say so in the goal.
      yaw_goal_tolerance: 3.15
      stateful: true
    headland_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Looser than in a row: the turn ends in open headland where being half a
      # metre out costs nothing, and the row leg that follows is what lines the
      # machine up with the aisle.
      xy_goal_tolerance: 0.75
      # A headland turn exists to point the robot down the next row, so unlike
      # an in-row goal this one is not reached until the heading is right.
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Matches the 0.8 m/s the fault scenarios drive at, so navigation and
      # open-loop runs stress the filter in the same velocity regime.
      vx_max: 0.8
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.0
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      # The Kraken steers; it cannot pivot. Told it was a differential drive,
      # MPPI opens every plan with a rotation in place, which a steered robot
      # answers by standing still, and then it never gets going at all. The
      # radius is the robot's own: wheelbase 2.2 m over tan(0.7 rad), the
      # steering limit the drive model falls back on.
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 2.61
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # The machine is 3.1 m long and pivots about its rear axle, so a
        # circular approximation is either useless or paralysing.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

    # The same controller, told it is doing a different job. Turning out of one
    # row and into another is not driving down a corridor: the robot needs the
    # whole headland, has to reverse to make a 2.61 m radius fit, and is not
    # finished until it points down the next row. Kept as a second instance
    # rather than as reconfiguration so a leg can be switched mid-mission by
    # publishing on controller_selector.
    HeadlandPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # A turn has to fit inside the horizon or the controller cannot see that
      # it is one. The default 56 steps of 0.05 s look 2.8 s, about 1.4 m,
      # ahead: less than a third of the 4.1 m arc that a 90 degree turn at
      # 2.61 m radius traces, so every sample looks like driving straight and
      # the robot leaves the row on a tangent and never comes back. 160 steps
      # look 8 s ahead, which holds the whole first arc of the manoeuvre.
      # model_dt stays at the 0.05 s control period so the warm start of the
      # previous sequence still lines up with real time.
      time_steps: 160
      model_dt: 0.05
      batch_size: 1500
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Slower than in-row: the manoeuvre is short, tight and the only place
      # the machine changes direction.
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      wz_max: 1.0
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      # The plan is pruned to what is still ahead of the robot. At 1.2 m that
      # is a stub pointing along the current heading, which is exactly the
      # information a turn does not need; keep enough of it to cover the
      # horizon.
      prune_distance: 5.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 2.61
      visualize: false
      regenerate_noises: true
      # PreferForwardCritic is gone. Rows are 3.5 m apart and the robot turns
      # on 2.61 m, so a headland manoeuvre that may not reverse cannot be done
      # at all; penalising reverse here only makes the robot fight its own plan.
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # The heading is the point of the manoeuvre, so it outweighs the
        # in-row setting and starts mattering long before the goal.
        cost_weight: 8.0
        threshold_to_consider: 1.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        # The plan's own orientations carry the direction changes; ignoring
        # them would align the robot to a path it is meant to back along.
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # Smac returns a feasible Reeds-Shepp path whose orientations already
        # say which way the robot faces on every segment, reverse ones
        # included, so judge against those rather than assuming forwards.
        mode: 2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Wide enough to hold a 3.1 m robot and the 2.6 m radius it turns on.
      width: 14
      height: 14
      resolution: 0.1
      # Measured off the prefab's colliders. base_link is the rear axle, not the
      # centre of the machine, so the box is not symmetric: the body runs 0.6 m
      # behind it and 2.5 m ahead, and the tyres are the widest point at 0.45 m.
      footprint: "[ [2.5, 0.45], [2.5, -0.45], [-0.6, -0.45], [-0.6, 0.45] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: pc
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # Two thirds of the cloud is ground return, and the lidar sits 0.97 m
          # up, so anything below knee height is the floor rather than a trunk.
          min_obstacle_height: 0.30
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # An aisle is 3.5 m between trunk lines and the canopy closes it to a
        # corridor of roughly 3 m. Inflating by the footprint's 2.55 m
        # circumscribed radius leaves no uninflated cell anywhere in a row, so
        # the robot would drive permanently in inflated cells and CostCritic
        # could not tell a centred pose from a scraping one. 0.55 m leaves a
        # ~1.9 m free band to aim at. Smac and MPPI both test the real
        # footprint, so what this gives up is the cheap circumscribed-cost
        # rejection ahead of that test, not the test.
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rolling because there is no map to be static against. Goals must sit
      # inside this window or the planner has nowhere to search: a goal at the
      # far end of a 50 m row, given from the row mouth, is outside a 60 m
      # window and the request is aborted before the robot moves at all. 100 m
      # spans a row and its headland from either end of it.
      rolling_window: true
      width: 100
      height: 100
      resolution: 0.1
      footprint: "[ [2.5, 0.45], [2.5, -0.45], [-0.6, -0.45], [-0.6, 0.45] ]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: pc
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.30
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.5
      # Not downsampled. Coarsening to 0.2 m takes the worst cost in each block
      # and so grows every trunk by up to a cell: in a 2.4 m aisle that is
      # enough to close the gap the machine is standing in, and the planner
      # refuses its own start pose. What made the search affordable instead was
      # halving the angle bins and caching the heuristic.
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 10.0
      # Dubin paths are forward-only, so a near miss can only be corrected by
      # driving a full 2.61 m-radius circle: two runs in eight overshot by
      # 0.65 m and spent 20 s and 33 m coming back round. The robot reverses,
      # so let the planner say so; reverse_penalty keeps it a last resort.
      motion_model_for_search: "REEDS_SHEPP"
      # 10 degrees per bin. Finer than the 2.61 m turning circle can express
      # and it only multiplies the states to expand.
      angle_quantization_bins: 36
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # The robot's own: wheelbase 2.2 m over tan(0.7 rad). Planning anything
      # tighter hands the controller a path it cannot steer.
      minimum_turning_radius: 2.61
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      # The goal holds still for a whole leg while the plan is refreshed every
      # second, so the 2D heuristic is worth keeping between those calls.
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # No spin: a steered robot cannot turn on the spot, so offering it as a
    # recovery only burns the time budget standing still.
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
