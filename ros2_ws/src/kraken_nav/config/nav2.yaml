# SPDX-License-Identifier: BSD-3-Clause
#
# Nav2 tuning for the flat headless sim: Smac Hybrid-A* down the rows, headland
# turns planned as geometry, and one tracker driving both.
#
# A row and the turn that follows it are planned separately and concatenated
# into a single FollowPath goal. That is what stops the machine dead at the end
# of every row: Nav2 brings a goal to a halt, so as long as the row was a goal
# of its own the halt was unavoidable no matter how quickly the turn that
# followed could be worked out.
#
# Deliberate omissions:
#   * No map_server and no static layer. Both costmaps are rolling windows, so
#     the world is remembered only as far back as the window reaches.
#
# The obstacle layer reads the O3DE robot's lidar. The headless sim carries no
# ranging sensor, so there the layer simply never receives an observation and
# the costmaps stay empty, as they always were.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    # Coverage is exactly the case Nav2's own tutorial gives for writing a
    # navigator of your own: the job is not a pose to reach, it is a field to
    # finish. So the mission is a third navigator alongside the two stock ones,
    # answering a CoverRows action, and not a script on the outside driving the
    # stack through NavigateToPose.
    navigators: ["navigate_to_pose", "navigate_through_poses", "cover_rows"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    cover_rows:
      plugin: "kraken_nav::CoverRowsNavigator"
      wheelbase: 2.2
      max_steering_angle: 0.7
    # Everything the coverage tree is built from is stock, and Jazzy loads the
    # stock node libraries by itself; only what Nav2 has no equivalent for gets
    # named here. That is three nodes: which aisle is next, which one was
    # written off, and when the row end is near enough that the turn out of it
    # can be planned against costmap rather than guesswork.
    plugin_lib_names:
      - kraken_cover_rows_bt_nodes

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: odometry/filtered
    # Jazzy defaults this to false; Kilted flips it. The simulator subscribes to
    # geometry_msgs/Twist, so pin it rather than inherit the distro's opinion.
    enable_stamped_cmd_vel: false
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # The end of a row is a place, not a point. At 0.25 m a 3.1 m machine
      # that cannot stop dead drives past its own goal and then has to come
      # round for it: one run overshot by 4 m and gave up. 0.6 m is inside the
      # width of the aisle it is standing in.
      xy_goal_tolerance: 0.6
      # A steered robot reaches a heading only by driving to it, so holding it
      # to one it was never asked for turns arriving into an endless circuit.
      # The scenarios score the position they reach; when a task genuinely
      # needs a heading it should say so in the goal.
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "kraken_nav::ArcTracker"
      # The machine, as the geometry needs it.
      wheelbase: 2.2
      max_steering_angle: 0.7
      # Full speed down a row, slower through a turn. The row figure matches
      # the 0.8 m/s the fault scenarios drive at, so navigation and open-loop
      # runs stress the filter in the same velocity regime.
      desired_linear_vel: 0.8
      turn_linear_vel: 0.4
      max_accel: 0.4
      max_decel: 0.4
      # Below this the path is straight enough to take at full speed. The
      # tightest arc the machine can drive is 0.38, so nothing that bends is
      # going to be mistaken for a straight.
      straight_curvature: 0.02
      # Curvature is read back off the path over this much of it. Differencing
      # neighbouring poses instead would turn the search planner's sampling
      # noise into steering.
      # Over how much of the plan the curvature to hold is read back out of it.
      # Counted in samples, because how much averaging a plan needs is
      # something it declares by how finely it sampled itself: the search
      # planner returns rows 0.4 m apart with a few degrees of noise on each
      # pose, so four of its samples average over 1.6 m, while the geometry
      # planner traces exact arcs every 5 cm and four of those span 0.2 m and
      # blur nothing. The window in metres is only a floor, against poses that
      # arrive on top of one another.
      # (Written as a decimal because the plugin declares its parameters as
      # doubles; an integer here is a different type and the controller server
      # refuses to configure.)
      curvature_samples: 4.0
      curvature_window: 0.15
      # How long a stretch of reversing has to be before it is believed to be a
      # reversal rather than one pose pointing the wrong way. No arc of a real
      # headland manoeuvre is shorter than this.
      min_segment: 1.0
      heading_gain: 0.8
      cross_gain: 0.6
      # How much of the steering left unused at the planned radius may be spent
      # correcting. The path is meant to be driven, not searched for.
      correction_share: 0.3
      # Further off the path than this and something is wrong that steering
      # harder will not fix, so stop and say so rather than lunge back across
      # an aisle with trees down both sides.
      max_cross_track: 0.75
      collision_lookahead: 2.0
      transform_tolerance: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Wide enough to hold a 3.1 m robot and the 2.6 m radius it turns on.
      width: 14
      height: 14
      resolution: 0.1
      # Measured off the prefab's colliders. base_link is the rear axle, not the
      # centre of the machine, so the box is not symmetric: the body runs 0.6 m
      # behind it and 2.5 m ahead, and the tyres are the widest point at 0.45 m.
      footprint: "[ [2.5, 0.45], [2.5, -0.45], [-0.6, -0.45], [-0.6, 0.45] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: pc
          data_type: "PointCloud2"
          marking: true
          clearing: true
          # Two thirds of the cloud is ground return, and the lidar sits 0.97 m
          # up, so anything below knee height is the floor rather than a trunk.
          min_obstacle_height: 0.30
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # An aisle is 3.5 m between trunk lines and the canopy closes it to a
        # corridor of roughly 3 m. Inflating by the footprint's 2.55 m
        # circumscribed radius leaves no uninflated cell anywhere in a row, so
        # the robot would drive permanently in inflated cells and CostCritic
        # could not tell a centred pose from a scraping one. 0.55 m leaves a
        # ~1.9 m free band to aim at. Smac and MPPI both test the real
        # footprint, so what this gives up is the cheap circumscribed-cost
        # rejection ahead of that test, not the test.
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rolling because there is no map to be static against. Goals must sit
      # inside this window or the planner has nowhere to search: a goal at the
      # far end of a 50 m row, given from the row mouth, is outside a 60 m
      # window and the request is aborted before the robot moves at all. 100 m
      # spans a row and its headland from either end of it.
      rolling_window: true
      width: 100
      height: 100
      resolution: 0.1
      footprint: "[ [2.5, 0.45], [2.5, -0.45], [-0.6, -0.45], [-0.6, 0.45] ]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: pc
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.30
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased", "Headland"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.5
      # Not downsampled. Coarsening to 0.2 m takes the worst cost in each block
      # and so grows every trunk by up to a cell: in a 2.4 m aisle that is
      # enough to close the gap the machine is standing in, and the planner
      # refuses its own start pose. What made the search affordable instead was
      # halving the angle bins and caching the heuristic.
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 10.0
      # Dubin paths are forward-only, so a near miss can only be corrected by
      # driving a full 2.61 m-radius circle: two runs in eight overshot by
      # 0.65 m and spent 20 s and 33 m coming back round. The robot reverses,
      # so let the planner say so; reverse_penalty keeps it a last resort.
      motion_model_for_search: "REEDS_SHEPP"
      # 10 degrees per bin. Finer than the 2.61 m turning circle can express
      # and it only multiplies the states to expand.
      angle_quantization_bins: 36
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # The robot's own: wheelbase 2.2 m over tan(0.7 rad). Planning anything
      # tighter hands the controller a path it cannot steer.
      minimum_turning_radius: 2.61
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      # The goal holds still for a whole leg while the plan is refreshed every
      # second, so the 2D heuristic is worth keeping between those calls.
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    # A headland turn has nothing left to search for. The machine has one
    # turning radius, the rows have one spacing and the headland has one depth,
    # and between them they decide the manoeuvre; the only question is which of
    # the three it is. Asked for a path from a row end to the mouth of the next
    # row, this returns that manoeuvre and no search happens at all.
    Headland:
      plugin: "kraken_nav::HeadlandPlanner"
      wheelbase: 2.2
      max_steering_angle: 0.7
      # The footprint the costmaps are given, rear axle at the origin. The
      # depth a turn needs is measured to the swept body rather than to the
      # axle: the nose is 2.5 m ahead of it before the turn even starts.
      front_overhang: 2.5
      rear_overhang: 0.6
      half_width: 0.45
      # Straight out of the row before anything swings, so the back of the
      # machine is past the last trunks before the wheels go over.
      entry: 0.8
      # Headland held back from the manoeuvre rather than offered to it. The
      # turn is chosen from where the row is predicted to end and the machine
      # arrives with a little error in hand, so a turn that fits to the last
      # centimetre does not fit at all.
      clearance: 1.0
      # Zero measures the headland off the costmap at the row end, which is the
      # only honest source: the two headlands in this orchard differ by 11 m.
      headland_depth: 0.0
      step: 0.05

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # No spin: a steered robot cannot turn on the spot, so offering it as a
    # recovery only burns the time budget standing still.
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
