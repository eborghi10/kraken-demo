/**:
  ros__parameters:
    channels: ["gnss", "imu", "wheel", "radar"]

    # Relative names, so the whole stack follows the robot's namespace.
    gnss:
      type: navsat
      input: gnss/fix
      output: gnss/fix/faulted

    imu:
      type: imu
      input: imu/data
      output: imu/data/faulted

    wheel:
      type: odometry
      input: wheel/odom
      output: wheel/odom/faulted
      publish_tf: true

    radar:
      type: twist
      input: ground_speed
      output: ground_speed/faulted
