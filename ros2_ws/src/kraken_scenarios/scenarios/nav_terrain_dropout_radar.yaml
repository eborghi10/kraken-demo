name: nav_terrain_dropout_radar
profile: radar
seed: 0
navigation: true
# See nav_baseline: the controller needs wall-clock headroom to be repeatable.
real_time_factor: 1.0
description: >
  nav_terrain_dropout with a ground-speed radar feeding forward velocity
  instead of the wheels. The ground is just as slippery and the fix is just as
  gone; the difference is that one sensor on the vehicle can still see how fast
  it is actually moving. If the radar earns its place, the robot arrives where
  it says it has.

terrain:
  default: 1.0
  patches:
    - {x: [3.0, 60.0], y: [-25.0, 25.0], traction: 0.45}

phases:
  - {label: settle, duration: 5.0, linear: 0.0, angular: 0.0}
  - {label: mark, action: mark_reference}
  - {label: kill_gnss, action: set_fault, channel: gnss, mode: dropout}
  - {label: goto, action: navigate_to, x: 12.0, y: 4.0, timeout: 120.0}

# Measured over 8 seeds: goal_error_estimated 0.77 +/- 0.07 (max 0.85),
# goal_error_true 0.75 +/- 0.08 (max 0.86), path_length 12.05 +/- 0.09,
# navigation_time 34.3 +/- 1.3 s.
#
# Those are the runs that started. Roughly one seed in eight never moves at
# all: the goal comes back in under a second, path_length is 0.00 and the robot
# is left the full 12.65 m from the goal. It reproduced in two independent
# 8-seed sweeps and is not caused by the terrain, which the other seven seeds
# cross without trouble. `min_path_length` already fails such a run, so the
# suite has always been intermittently red here; the numbers above are the
# median-consistent statistics over the seeds that drove.
#
# The two goal errors are asserted to the same bound. That is the whole claim:
# with the radar the robot's account of where it is can be believed again, so
# there is no longer a reason to hold truth to a looser tolerance than belief.
# It lands at 0.75 against the baseline's 0.62, both of them set by the 0.6 m
# xy_goal_tolerance rather than by the filter.
#
# It takes 34 s against the baseline's 19 s, because it really is crossing
# slippery ground and no sensor changes that. Arriving late is the honest
# outcome; arriving in 19 s is what the version without a radar reports.
expect:
  expect_navigation_succeeded: 1.0
  max_goal_error_estimated: 1.1
  max_goal_error_true: 1.1
  max_position_error: 0.5
  # 11.5, not 12.0. Measured path_length is 12.05 +/- 0.09, so a bound at 12.0
  # sits half a standard deviation below the mean and fails a third of runs on
  # spread alone. What the guard is for is the separation from the radar-less
  # run, which covers 7.13 m, and 11.5 keeps all of that.
  min_path_length: 11.5
  # The lower time bound is the assertion the paragraph above makes in prose: a
  # run that finishes as fast as the baseline did not cross slippery ground, so
  # something about the terrain stopped working and the goal errors alone would
  # not notice. It is the one time bound worth tightening, because load can only
  # push a duration up; the upper bound is loose for the reason given in
  # nav_baseline.
  min_elapsed_time_s: 25.0
  max_elapsed_time_s: 110.0
  # Lateral tracking is better here than on the baseline, not worse - the
  # corrected estimate lets the tracker hold the line it was given.
  max_cross_track_error: 1.2
  max_mean_cross_track_error: 0.7
  max_recovery_count: 2
