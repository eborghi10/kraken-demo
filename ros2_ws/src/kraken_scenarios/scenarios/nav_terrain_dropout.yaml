name: nav_terrain_dropout
profile: robust
seed: 0
navigation: true
# See nav_baseline: the controller needs wall-clock headroom to be repeatable.
real_time_factor: 1.0
description: >
  The same goal as nav_baseline, with the fix lost and the ground slippery from
  3 m out. The wheels turn at the commanded rate and the encoders report it
  honestly, so the estimate sails to the goal while the robot lags behind it.
  Nav2 stops when the estimate arrives, because the estimate is all it has.

terrain:
  default: 1.0
  patches:
    - {x: [3.0, 60.0], y: [-25.0, 25.0], traction: 0.45}

phases:
  - {label: settle, duration: 5.0, linear: 0.0, angular: 0.0}
  - {label: mark, action: mark_reference}
  - {label: kill_gnss, action: set_fault, channel: gnss, mode: dropout}
  - {label: goto, action: navigate_to, x: 12.0, y: 4.0, timeout: 120.0}

# Measured over 8 seeds: goal_error_estimated 0.239 +/- 0.006 (max 0.246),
# goal_error_true 5.494 +/- 0.023 (min 5.462), path_length 7.31 +/- 0.05,
# navigation_time 22.81 +/- 0.26 s, succeeded 8/8.
#
# The pair of goal bounds is the point of this scenario. The robot must still
# believe it arrived, to the same tolerance nav_baseline passes, while actually
# being metres short. Loosening either one alone would let the bug back in.
#
# navigation_succeeded used to be left unasserted, because Nav2 returned
# SUCCEEDED in only 5 of 8 runs and requiring either value made the test flaky.
# Once the controller was given the robot's real kinematics the outcome
# settled: it now declares success in every run, 5.5 m from the goal. That is
# the finding, and it is sharper for being reliable. MPPI assumes the commanded
# velocity is achieved, so on slippery ground it mispredicts every rollout.
expect:
  expect_navigation_succeeded: 1.0
  max_goal_error_estimated: 0.6
  min_goal_error_true: 4.0
  max_goal_error_true: 7.0
  min_position_error: 4.0
  max_position_error: 7.0
  min_path_length: 6.0
