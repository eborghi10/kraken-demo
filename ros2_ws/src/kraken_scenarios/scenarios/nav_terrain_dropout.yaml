name: nav_terrain_dropout
profile: robust
seed: 0
navigation: true
# See nav_baseline: the controller needs wall-clock headroom to be repeatable.
real_time_factor: 1.0
description: >
  The same goal as nav_baseline, with the fix lost and the ground slippery from
  3 m out. The wheels turn at the commanded rate and the encoders report it
  honestly, so the estimate sails to the goal while the robot lags behind it.
  Nav2 stops when the estimate arrives, because the estimate is all it has.

terrain:
  default: 1.0
  patches:
    - {x: [3.0, 60.0], y: [-25.0, 25.0], traction: 0.45}

phases:
  - {label: settle, duration: 5.0, linear: 0.0, angular: 0.0}
  - {label: mark, action: mark_reference}
  - {label: kill_gnss, action: set_fault, channel: gnss, mode: dropout}
  - {label: goto, action: navigate_to, x: 12.0, y: 4.0, timeout: 120.0}

# Measured over 8 seeds: goal_error_estimated 0.587 +/- 0.010 (max 0.600),
# goal_error_true 5.658 +/- 0.026 (min 5.621), path_length 7.13 +/- 0.02,
# navigation_time 21.55 +/- 5.36 s, succeeded 8/8.
#
# The pair of goal bounds is the point of this scenario. The robot must still
# believe it arrived, to the same tolerance nav_baseline passes, while actually
# being metres short. Loosening either one alone would let the bug back in.
#
# The believed error matches the control's 0.583 to within a hundredth, which
# is the whole finding: every number the robot can compute about itself says
# this run went as well as the flat one did.
#
# navigation_succeeded used to be left unasserted, because Nav2 returned
# SUCCEEDED in only 5 of 8 runs and requiring either value made the test flaky.
# Once the controller was given the robot's real kinematics the outcome
# settled: it now declares success in every run, 5.7 m from the goal. That is
# the finding, and it is sharper for being reliable.
expect:
  expect_navigation_succeeded: 1.0
  max_goal_error_estimated: 0.9
  min_goal_error_true: 4.0
  max_goal_error_true: 7.0
  min_position_error: 4.0
  max_position_error: 7.0
  min_path_length: 6.0
  # Over the same 8 seeds the cross-track stayed at baseline levels, 0.59 +/-
  # 0.23 (max 1.02), and no run invoked a recovery. That is the shape of this
  # failure: the robot drives the right line and simply does not get far enough
  # along it, so bounding the lateral error keeps a future fix honest rather
  # than letting it trade wandering for distance.
  #
  # Slippery ground does stall the machine when the box is loaded - one suite
  # run spent a 5 s Wait behaviour here - so a handful of recoveries is the
  # shape of this scenario and a dozen would mean something else broke. See
  # nav_baseline on why the time bound is loose; this one is looser still,
  # because slip pushed one of the 8 sweep runs to 34.7 s against a 20 s median.
  max_cross_track_error: 2.0
  max_recovery_count: 4
  max_elapsed_time_s: 100.0
